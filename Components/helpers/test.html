<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>TURN WebRTC Video Test</title>
<style>
body { font-family: sans-serif; text-align: center; padding: 20px; }
video { width: 45%; margin: 10px; background: #000; }
</style>
</head>
<body>

<h2>TURN WebRTC Video/Audio Test</h2>

<p>روی هر دو سیستم یک Room ID یکسان وارد کنید</p>

<input id="room" placeholder="Room ID" style="padding:10px;width:250px;font-size:16px">
<button onclick="join()">Join</button>

<div style="margin-top:20px;">
    <video id="local" autoplay playsinline muted></video>
    <video id="remote" autoplay playsinline></video>
</div>

<script>
const servers = {
  iceServers: [
    {
      urls: "turn:37.32.20.192:3478?transport=udp",
      username: "test",
      credential: "test"
    }
  ]
};

let pc;
let ws;

async function join(){
  const room = document.getElementById("room").value.trim();
  if(!room) return alert("Room ID را وارد کن");

  ws = new WebSocket("wss://signal.webrtc-test.ir/?r=" + room);
  
  ws.onmessage = async (msg)=>{
    const data = JSON.parse(msg.data);

    if(data.offer){
      pc.setRemoteDescription(data.offer);
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      ws.send(JSON.stringify({answer: ans}));
    }

    if(data.answer){
      await pc.setRemoteDescription(data.answer);
    }

    if(data.ice){
      try{ pc.addIceCandidate(data.ice); }catch(e){}
    }
  };

  // ایجاد PeerConnection
  pc = new RTCPeerConnection(servers);

  pc.onicecandidate = e=>{
    if(e.candidate)
      ws.send(JSON.stringify({ice: e.candidate}));
  };

  pc.ontrack = e=>{
    document.getElementById("remote").srcObject = e.streams[0];
  };

  // گرفتن صدا و تصویر
  const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
  document.getElementById("local").srcObject = stream;

  stream.getTracks().forEach(t=>pc.addTrack(t, stream));

  // اگر این نفر نفر اول است، Offer می‌سازیم
  ws.onopen = async ()=>{
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({offer: offer}));
  };
}
</script>

</body>
</html>
